# @package _global_

# Wah Pedal CNN experiment: Decaying Sawtooth into Fixed Wah Pedal
# python src/train.py experiment=wah_cnn_tiny

defaults:
  - override /data: vimh
  - override /model: cnn_tiny # ~41K trainable parameters
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_tiny"]

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 200  # Reduced from 500 based on rapid convergence

model:
  optimizer:
    lr: 0.01  # Higher LR for faster initial learning
    weight_decay: 0.01  # Moderate weight decay for regularization
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5  # More aggressive reduction than default 0.1
    patience: 3  # Shorter patience for faster LR decay

data:
#  data_dir: data/vimh-32x32x1_8000Hz_1p0s_256dss_saw_wah_2p
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use larger dataset (16k samples)
  batch_size: 64  # Can use larger batch size with more data

logger:
  tensorboard:
    name: "wah_cnn_tiny"
