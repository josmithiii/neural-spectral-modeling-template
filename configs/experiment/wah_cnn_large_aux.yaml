# @package _global_

# Wah Pedal Hybrid CNN-MLP experiment: Decaying Sawtooth into Fixed Wah Pedal
# python src/train.py experiment=wah_cnn_large_aux
# Hybrid architecture: CNN for spectral patterns + MLP for decay_time auxiliary feature

defaults:
  - override /data: vimh
  - override /model: cnn_medium # ../model/cnn_medium.yaml - was cnn_tiny: Medium model for wah parameter dataset - ../model/cnn_tiny.yaml
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_medium", "auxiliary_features"]

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 500

model:
  optimizer:
    lr: 0.001  # Slightly lower learning rate for better convergence
    weight_decay: 0.01  # Moderate weight decay for regularization

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use larger dataset (16k samples)
  batch_size: 64  # Can use larger batch size with more data
  auxiliary_features: ["decay_time"]  # Extract decay_time and feed through MLP pathway

logger:
  tensorboard:
    name: "wah_cnn_large_aux"
