_target_: src.models.vimh_lit_module.VIMHLitModule

optimizer:
  _target_: torch.optim.Adam
  _partial_: true
  lr: 0.01
  weight_decay: 0.01

scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  _partial_: true
  mode: min
  factor: 0.5
  patience: 3

# Explicit weighted cross-entropy loss configuration
criteria:
  log10_decay_time:
    _target_: src.models.losses.WeightedCrossEntropyLoss
    num_classes: 256
    distance_power: 2.0
    base_weight: 1.0
  wah_position:
    _target_: src.models.losses.WeightedCrossEntropyLoss
    num_classes: 256
    distance_power: 2.0
    base_weight: 1.0

loss_weights: {} # Will be auto-configured from dataset metadata

net:
  _target_: src.models.components.simple_cnn.SimpleCNN
  input_channels: 1
  conv1_channels: 16
  conv2_channels: 32
  fc_hidden: 64
  heads_config:
    log10_decay_time: 256
    wah_position: 256
  dropout: 0.5
  input_size: 32

compile: false

# Auto-configure parameter ranges from dataset metadata
auto_configure_from_dataset: true