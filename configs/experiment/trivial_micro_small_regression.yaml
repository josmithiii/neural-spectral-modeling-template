# @package _global_

# Micro CNN on small (256 samples) trivial dataset with regression mode
# python src/train.py experiment=trivial_micro_small_regression

defaults:
  - override /data: vimh
  - override /model: cnn_micro_regression
  - override /callbacks: default
  - override /trainer: default

# Callbacks configuration for regression mode
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: "val/mae_best"
    mode: "min"
    save_top_k: 1
    save_last: true
    verbose: false
    dirpath: ${paths.output_dir}/checkpoints  # per-run (was shared logs/checkpoints: best-vN pile-up)
    filename: "epoch_{epoch:03d}"
    auto_insert_metric_name: False
  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/mae_best"
    patience: 10
    verbose: false
    mode: "min"

tags: ["trivial", "micro", "small_data", "regression"]

seed: 12345

# Long enough to show learning (early stopping ends it at convergence, ~5 s on MPS).
# Predicting the mean scores val/mae_best ~0.25 (range-normalized); a working
# regression pipeline reaches ~0.02-0.03. At 5 epochs it could not be told apart
# from the mean (0.26 in the 2026-10-02 baselines).
trainer:
  min_epochs: 3
  max_epochs: 50

model:
  optimizer:
    lr: 0.005
    weight_decay: 0.01

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_256dss_saw_wah_2p
  batch_size: 32

logger:
  tensorboard:
    name: "trivial_micro_small_regression"

# Set the optimized metric for regression mode
optimized_metric: "val/mae_best"
