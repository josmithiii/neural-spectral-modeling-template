# @package _global_
# Envelope-modulated Crybaby Wah Pedal configuration - Classic wah-wah sweeps

# Dataset parameters
dataset:
  name: "crybaby_wah" # Custom dataset name for output directory
  size: 512 # More samples for envelope parameter space
  sampling_rate: 8000 # Sample rate in Hz
  duration: 2.0 # Longer duration to hear full envelope

# Generation parameters
generate:
  batch_size: 8 # Processing batch size
  output_dir: "data" # Base output directory
  pre_emphasis_coefficient: 0.0 # Pre-emphasis filter coefficient (disabled for flat spectrum test)
  taper: false # Taper breath pressure at note ends
  threshold_db: -40 # Audio threshold in dB

  # Output image dimensions
  height: 32 # Spectrogram height (mel bins)
  width: 64 # Wider for longer duration
  channels: 1 # Number of channels (1=grayscale, 3=RGB for derived channels)

# Synthesizer configuration
synthesizer:
  type: simple_saw

  # Parameters that can vary during dataset generation
  parameters:
    # MIDI note number - vary for more interesting filter effects
    note_number:
      min_value: 36.0 # C2 (65.4 Hz) - bass range where wah is most audible
      step: 12.0 # Octave steps
      max_value: 60.0 # C4 (261.6 Hz)
      default: 48.0 # C3
      description: "MIDI note number (bass to mid range)"

    # MIDI velocity
    note_velocity:
      min_value: 100.0
      step: 10.0
      max_value: 127.0
      default: 120.0
      description: "MIDI velocity (amplitude)"

    # Amplitude decay time
    log10_decay_time:
      min_value: 0.0 # log10(1.0) = 0.0 - 1 second decay
      step: 0.15
      max_value: 0.6 # log10(4.0) = 0.602 - 4 second decay
      default: 0.3 # log10(2.0) = 0.301 - 2 second decay
      description: "Log10 of exponential decay time constant"

    # Filter always enabled
    filter_enabled:
      min_value: 1.0
      max_value: 1.0
      default: 1.0
      description: "Enable Crybaby wah pedal filter"


    # Base wah position (starting point for envelope)
    wah_position:
      min_value: 0.0 # Fully closed (bass)
      step: 0.1
      max_value: 0.4 # Partially open - let envelope do the sweep
      default: 0.1 # Mostly closed
      description: "Base wah pedal position (0-1)"

    # Filter envelope attack time
    filter_env_attack:
      min_value: 0.0 # Instant attack
      step: 0.05
      max_value: 0.3 # Slow attack
      default: 0.01
      description: "Wah envelope attack time (seconds)"

    # Filter envelope decay time
    filter_env_decay:
      min_value: 0.1 # Quick decay
      step: 0.1
      max_value: 1.5 # Long decay
      default: 0.5 # Classic wah decay
      description: "Wah envelope decay time (seconds)"

    # Filter envelope sustain level
    filter_env_sustain:
      min_value: 0.0 # Full decay to base position
      step: 0.1
      max_value: 0.6 # Partial sustain
      default: 0.1
      description: "Wah envelope sustain level (0-1)"

    # Filter envelope release time
    filter_env_release:
      min_value: 0.1 # Quick release
      step: 0.1
      max_value: 1.0 # Long release
      default: 0.3
      description: "Wah envelope release time (seconds)"

    # Filter envelope amount (wah sweep range)
    filter_env_amount:
      min_value: 0.3 # Small sweep
      step: 0.1
      max_value: 0.8 # Nearly full sweep range
      default: 0.6 # Classic wah sweep
      description: "Wah envelope depth (0-1 sweep range)"

# Configuration references
defaults:
  - /stft: filter_analysis_128
  - /mel: default
  - _self_

# Logging configuration
log_level: DEBUG

# Hydra configuration
hydra:
  run:
    dir: outputs/generate_wah_envelope/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
