# @package _global_
# BassNotesSynth dataset generation configuration

dataset:
  name: "bass_notes"
  size: 20000
  sampling_rate: 16000
  duration: 1.0

generate:
  batch_size: 256
  output_dir: "data"
  pre_emphasis_coefficient: 0.0
  taper: false
  threshold_db: -60

  height: 32
  width: 32
  channels: 1

synthesizer:
  type: bass_notes

  osc: "saw_lp"
  add_attack_click: true

  parameters:
    note_on:
      min_value: 0.0
      max_value: 1.0
      default: 1.0
      step: 1.0
      description: "0 = no note (silence), 1 = note present"

    note_number:
      min_value: 28.0
      max_value: 52.0
      default: 40.0
      step: 1.0
      description: "Bass MIDI note number"

    note_velocity:
      min_value: 40.0
      max_value: 120.0
      default: 90.0
      step: 1.0
      description: "Bass velocity / amplitude"

    log10_decay_time:
      min_value: -1.5
      max_value: 0.3
      default: -0.3
      step: 0.1
      description: "Log10 decay time constant (seconds)"

    onset_delay_ms:
      min_value: -80.0
      max_value: 80.0
      default: 0.0
      step: 5.0
      description: "Onset time offset (ms) relative to reference (e.g., clip center)"

defaults:
  - /stft: pitch_sync_80
  - /mel: default
  - _self_

mel:
  freq_min: 25.0
  freq_max_ratio: 0.9

log_level: INFO

hydra:
  run:
    dir: outputs/generate_${dataset.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
