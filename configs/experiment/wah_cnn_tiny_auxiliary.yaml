# @package _global_

# Wah Pedal CNN experiment: Tiny CNN with Auxiliary Input (decay_time)
# python src/train.py experiment=wah_cnn_tiny_auxiliary

defaults:
  - override /data: vimh
  - override /model: cnn_tiny # ~40K trainable parameters, cross_entropy loss
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_tiny", "auxiliary", "cross_entropy"]

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 200  # Same as regular tiny

model:
  optimizer:
    lr: 0.01  # Same as regular tiny
    weight_decay: 0.01
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5
    patience: 3

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use same large dataset
  batch_size: 64  # Same as regular tiny
  auxiliary_features: ["log10_decay_time"]  # Use decay_time as auxiliary input

logger:
  tensorboard:
    name: "wah_cnn_tiny_auxiliary"