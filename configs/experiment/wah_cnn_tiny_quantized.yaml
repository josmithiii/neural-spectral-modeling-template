# @package _global_

# Wah Pedal CNN experiment: Quantized Regression Loss
# python src/train.py experiment=wah_cnn_tiny_quantized

defaults:
  - override /data: vimh
  - override /model: cnn_tiny_quantized # Lightweight quantized regression loss
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_tiny", "quantized_regression"]

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 200

model:
  optimizer:
    lr: 0.01
    weight_decay: 0.01
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5
    patience: 3

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use larger dataset (16k samples)
  batch_size: 64

logger:
  tensorboard:
    name: "wah_cnn_tiny_quantized"