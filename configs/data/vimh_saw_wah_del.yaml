_target_: src.data.vimh_datamodule.VIMHDataModule

# Path to VIMH-format dataset with saw+wah+onset_delay (3 params)
# Random sampling (not AVIX grid), 16k samples
data_dir: ${paths.root_dir}/data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_del_3p

# Data loader settings
batch_size: 64
num_workers: 0 # MPS doesn't support multiprocessing
pin_memory: false
persistent_workers: false
