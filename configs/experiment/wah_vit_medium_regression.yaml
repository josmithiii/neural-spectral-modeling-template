# @package _global_

# Wah Pedal ViT experiment: Medium ViT Regression on Decaying Sawtooth into Fixed Wah Pedal
# python src/train.py experiment=wah_vit_medium_regression

defaults:
  - override /data: vimh
  - override /model: vit_medium_regression # ~1M+ parameters
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "vit_medium", "regression"]

seed: 12345

# Use the correct metric for regression models (MAE instead of accuracy)
optimized_metric: "val/mae_best"

trainer:
  min_epochs: 20
  max_epochs: 200

callbacks:
  model_checkpoint:
    monitor: "val/mae_best"
    mode: "min"
  early_stopping:
    monitor: "val/mae_best"
    mode: "min"

model:
  optimizer:
    lr: 0.001  # Lower LR for larger ViT
    weight_decay: 0.0001  # Match CNN medium regression
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.1
    patience: 10  # Longer patience for larger model
  # Use L1 loss in normalized space
  criteria:
    log10_decay_time:
      loss_type: l1
    wah_position:
      loss_type: l1

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p
  batch_size: 32  # Smaller batch for larger model (memory)
  label_mode: regression  # Return continuous targets for regression

logger:
  tensorboard:
    name: "wah_vit_medium_regr"