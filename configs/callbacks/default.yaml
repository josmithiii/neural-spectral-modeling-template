defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - _self_

model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/midi_pitch_acc"
  mode: "max"
  save_top_k: 1
  save_last: true
  auto_insert_metric_name: false

early_stopping:
  monitor: "val/midi_pitch_acc"
  patience: 100
  mode: "max"

model_summary:
  max_depth: -1
