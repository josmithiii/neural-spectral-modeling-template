# @package _global_

# Crybaby Wah Pedal Envelope CNN experiment
# python src/train.py experiment=crybaby_cnn_envelope

defaults:
  - override /data: vimh
  - override /model: cnn_tiny # Medium model for wah parameter dataset - ../model/cnn_tiny.yaml
  - override /callbacks: default
  - override /trainer: default

tags: ["crybaby", "wah", "envelope", "cnn_tiny"]

seed: 12345

trainer:
  min_epochs: 8
  max_epochs: 25

model:
  optimizer:
    lr: 0.002
    weight_decay: 0.015

data:
  data_dir: data/vimh-32x64x1_8000Hz_2p0s_512dss_crybaby_wah_9p
  batch_size: 24 # Smaller batch for wider images

logger:
  tensorboard:
    name: "crybaby_cnn_envelope"
