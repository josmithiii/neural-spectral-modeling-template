# @package _global_

# Wah Pedal CNN experiment: Medium CNN on Decaying Sawtooth into Fixed Wah Pedal
# python src/train.py experiment=wah_cnn_medium

defaults:
  - override /data: vimh
  - override /model: cnn_medium # Medium CNN with more parameters
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_medium", "cross_entropy"]

seed: 12345

trainer:
  min_epochs: 20
  max_epochs: 200  # Same as tiny for comparison

model:
  optimizer:
    lr: 0.01  # Same as tiny initially
    weight_decay: 0.01  # Same regularization
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5
    patience: 3

data:
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use same large dataset
  batch_size: 64  # Same batch size for comparison

logger:
  tensorboard:
    name: "wah_cnn_medium"