# @package _global_

# Micro CNN on small (256 samples) trivial dataset with regression mode
# python src/train.py experiment=trivial_micro_small_regression

defaults:
  - override /data: vimh
  - override /model: cnn_micro
  - override /callbacks: default
  - override /trainer: default

# Callbacks configuration for regression mode
callbacks:
  model_checkpoint:
    _target_: lightning.pytorch.callbacks.ModelCheckpoint
    monitor: "val/acc_best"
    mode: "max"
    save_top_k: 1
    save_last: true
    verbose: false
    dirpath: ${paths.log_dir}/checkpoints
    filename: "best"

  early_stopping:
    _target_: lightning.pytorch.callbacks.EarlyStopping
    monitor: "val/acc_best"
    patience: 10
    verbose: false
    mode: "max"


tags: ["trivial", "micro", "small_data", "classification", "pitch"]


seed: 12345

trainer:
  min_epochs: 10
  max_epochs: 100

model:
  optimizer:
    lr: 0.005
    weight_decay: 0.01

    
vimh_configurator:
  parameter_names: [midi_pitch]



data:
  data_dir: ${paths.root_dir}/data/vimh-32x32x1_44100Hz_1p0s_8192dss_bass_onset_1p
  batch_size: 128

logger:
  tensorboard:
    name: "trivial_micro_small_pitch_classification"
    log_graph: false


# Set the optimized metric for regression mode
optimized_metric: "val/acc_best"

