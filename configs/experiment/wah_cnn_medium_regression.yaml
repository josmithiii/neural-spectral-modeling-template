# @package _global_

# Wah Pedal CNN experiment: Decaying Sawtooth into Fixed Wah Pedal
# python src/train.py experiment=wah_cnn_medium_regression

defaults:
  - override /data: vimh
  - override /model: cnn_medium_regression # ~1.1M parameters
  - override /callbacks: default
  - override /trainer: default

tags: ["wah", "cnn_medium", "regression"]

seed: 12345

# Use the correct metric for regression models (MAE instead of accuracy)
optimized_metric: "val/mae_best"

trainer:
  min_epochs: 20
  max_epochs: 200  # Reduced from 500 based on rapid convergence

callbacks:
  model_checkpoint:
    monitor: "val/mae_best"
    mode: "min"
  early_stopping:
    monitor: "val/mae_best"
    mode: "min"

model:
  optimizer:
    lr: 0.005  # Tuned for better MAE with larger batch
    weight_decay: 0.005  # Tuned regularization
  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    _partial_: true
    mode: min
    factor: 0.5  # More aggressive reduction than default 0.1
    patience: 3  # Shorter patience for faster LR decay
  # Use medium model architecture (already configured in cnn_medium_regression)
  # Use L1 loss in normalized space (merged with auto-configured criteria per head)
  criteria:
    log10_decay_time:
      loss_type: l1 # GPT5 says "L1 loss and a modest capacity bump often reduce MAE and stabilize training for continuous targets"
    wah_position:
      loss_type: l1

data:
#  data_dir: data/vimh-32x32x1_8000Hz_1p0s_256dss_saw_wah_2p
  data_dir: data/vimh-32x32x1_8000Hz_1p0s_16384dss_saw_wah_2p  # Use larger dataset (16k samples)
  batch_size: 128  # Larger batch improved validation MAE
  # pin_memory: true
  label_mode: regression  # Return continuous targets for regression

logger:
  tensorboard:
    name: "wah_cnn_medium_regr"
