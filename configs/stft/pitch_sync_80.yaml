# Pitch-synchronous STFT for 80-sample periods (e.g., 100Hz fundamental F0 at 8kHz sample rate)

type: "stft"   # "stft" or "mel"
n_fft: 80      # Must be >= n_window for STFT
n_window: 80   # pitch_synchronous analysis needs no zero-padding
hop_length: 80 # pitch_synchronous analysis needs no overlap
window_type: "rectangular" # "rectangular" for pitch-synchronous analysis, otherwise "hann", "hamming", or "blackman"
bins_per_harmonic: 1.0     # integer zero-padding factor if desired, e.g., to accommodate vibrato
